[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evovision"
version = "0.1.0"
description = "Multi-objective evolutionary neural-architecture search for efficient vision"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Advait Shukla" }]
keywords = ["neural-architecture-search", "evolutionary-algorithms", "computer-vision", "multi-objective", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.20",
  "torch>=2.0",
  "torchvision>=0.15",
  "coevo @ git+https://github.com/AdvaitS/coevo",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/evovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
